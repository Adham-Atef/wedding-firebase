<!DOCTYPE html>
<html>
<body>
<svg viewBox="0 0 400 400" width="400" height="400" style="background:#fff;">
  <defs>
    <filter id="watercolor">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    
    <filter id="splashFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <radialGradient id="mainFlowerGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stopColor="#431418" />
      <stop offset="15%" stopColor="#6C262E" />
      <stop offset="45%" stopColor="#AD535E" />
      <stop offset="75%" stopColor="#D98A90" />
      <stop offset="100%" stopColor="#EAD3D5" />
    </radialGradient>

    <radialGradient id="petalGrad" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stopColor="#AD535E" />
      <stop offset="100%" stopColor="#EAD3D5" />
    </radialGradient>

    <radialGradient id="smallFlowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4A1E1E" />
      <stop offset="30%" stopColor="#B36054" />
      <stop offset="70%" stopColor="#E19D88" />
      <stop offset="100%" stopColor="#F4D3C9" />
    </radialGradient>
  </defs>

  <!-- Watercolor Splash -->
  <path d="M 0 0 L 250 0 C 300 50, 250 150, 150 250 C 50 300, 0 250, 0 0 Z" fill="#A8BCA0" opacity="0.3" filter="url(#splashFilter)" />

  <g filter="url(#watercolor)">
    <!-- Delicate Stems & Foliage -->
    <!-- Brown stems extending right -->
    <path d="M 50 50 Q 150 80 280 40" stroke="#7D5F54" strokeWidth="1.5" fill="none" />
    <path d="M 120 70 Q 220 120 320 100" stroke="#7D5F54" strokeWidth="1.2" fill="none" />
    <!-- Stems extending down -->
    <path d="M 50 50 Q 80 150 40 280" stroke="#7D5F54" strokeWidth="1.5" fill="none" />
    <path d="M 70 120 Q 120 220 100 320" stroke="#7D5F54" strokeWidth="1.2" fill="none" />

    <!-- Dark Green Leaves -->
    <!-- Right extending -->
    <path d="M 160 50 C 180 30, 210 40, 220 60 C 200 70, 170 70, 160 50 Z" fill="#4B6051" />
    <path d="M 220 80 C 250 60, 270 70, 280 90 C 250 100, 230 100, 220 80 Z" fill="#4B6051" />
    <!-- Down extending -->
    <path d="M 50 160 C 30 180, 40 210, 60 220 C 70 200, 70 170, 50 160 Z" fill="#4B6051" />

    <!-- Light Sage Leaves -->
    <path d="M 110 20 C 140 0, 170 10, 180 30 C 150 40, 120 40, 110 20 Z" fill="#88A291" opacity="0.8" />
    <path d="M 200 110 C 220 90, 250 100, 260 120 C 230 140, 210 130, 200 110 Z" fill="#88A291" opacity="0.8" />
    <path d="M 20 110 C 0 140, 10 170, 30 180 C 40 150, 40 120, 20 110 Z" fill="#88A291" opacity="0.8" />

    <!-- Peach / Tiny leaves -->
    <path d="M 250 40 C 260 30, 270 35, 275 45 C 265 50, 255 50, 250 40 Z" fill="#D98A90" />
    <path d="M 280 50 C 290 40, 300 45, 305 55 C 295 60, 285 60, 280 50 Z" fill="#E19D88" />
    <path d="M 40 250 C 30 260, 35 270, 45 275 C 50 265, 50 255, 40 250 Z" fill="#D98A90" />

    <!-- Small Flower (Right) -->
    <g transform="translate(190, 130)">
      <path d="M 0 0 C 20 -30, 40 -10, 30 10 C 10 20, 0 10, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C 30 -10, 30 20, 10 30 C -10 20, -10 0, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C 10 30, -20 30, -30 10 C -20 -10, -10 -10, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C -30 10, -30 -20, -10 -30 C 10 -20, 10 0, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <!-- Center -->
      <circle cx="0" cy="0" r="5" fill="#3E1A1A" />
      <circle cx="-2" cy="-2" r="1.5" fill="#E8B071" />
      <circle cx="2" cy="1" r="1.5" fill="#E8B071" />
    </g>

    <!-- Small Flower (Bottom) -->
    <g transform="translate(130, 190) scale(0.8)">
      <path d="M 0 0 C 20 -30, 40 -10, 30 10 C 10 20, 0 10, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C 30 -10, 30 20, 10 30 C -10 20, -10 0, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C 10 30, -20 30, -30 10 C -20 -10, -10 -10, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <path d="M 0 0 C -30 10, -30 -20, -10 -30 C 10 -20, 10 0, 0 0 Z" fill="url(#smallFlowerGrad)" />
      <!-- Center -->
      <circle cx="0" cy="0" r="5" fill="#3E1A1A" />
    </g>

    <!-- MAIN LARGE FLOWER -->
    <g transform="translate(90, 90)">
      <!-- Outer wide petals -->
      <path d="M 0 0 C 80 -60, 120 0, 60 50 Z" fill="url(#mainFlowerGrad)" />
      <path d="M 0 0 C 60 80, -10 110, -50 50 Z" fill="url(#mainFlowerGrad)" />
      <path d="M 0 0 C -80 50, -100 -20, -40 -60 Z" fill="url(#mainFlowerGrad)" />
      <path d="M 0 0 C -40 -100, 40 -100, 40 -50 Z" fill="url(#mainFlowerGrad)" />
      
      <!-- Inner detailed petals -->
      <path d="M -10 -10 C 60 -40, 80 10, 40 40 C 20 50, 0 30, -10 -10 Z" fill="#D27A84" opacity="0.8" />
      <path d="M 10 10 C 30 60, -20 70, -40 30 C -50 10, -20 0, 10 10 Z" fill="#BA5F6B" opacity="0.8" />
      <path d="M -10 10 C -50 40, -70 -10, -30 -30 C -10 -40, 10 -20, -10 10 Z" fill="#E2A1A8" opacity="0.9" />

      <!-- Center cone/ruffle -->
      <path d="M -5 -5 C 20 -20, 30 10, 10 20 C -10 30, -30 0, -5 -5 Z" fill="#6A2229" />
      <path d="M 0 0 C 10 -10, 15 5, 5 10 C -5 15, -15 0, 0 0 Z" fill="#391014" />
      
      <!-- Stamen dots -->
      <circle cx="5" cy="0" r="1.5" fill="#E6C289" />
      <circle cx="8" cy="5" r="1.5" fill="#E6C289" />
      <circle cx="-2" cy="8" r="1.5" fill="#E6C289" />
      <circle cx="-7" cy="2" r="1.5" fill="#E6C289" />
      <circle cx="-3" cy="-5" r="1.5" fill="#E6C289" />
    </g>
  </g>
</svg>
</body>
</html>
